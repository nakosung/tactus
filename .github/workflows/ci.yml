name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Example songs compile
        run: node tests/compile.test.js
      - name: Voice to code and sound match
        run: node tests/voice.test.js && node tests/match.test.js && node tests/sep.test.js
      - name: Pages build
        run: python3 build.py
      - name: Rust DSP matches the JavaScript voices
        run: node dsp/bench/bench.js 2
